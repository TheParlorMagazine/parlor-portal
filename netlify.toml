# Netlify build config for the Next.js app.
# The official Next.js runtime plugin handles SSR, API routes, and ISR.
# This file is ignored by Vercel, so it does not affect the current Vercel setup.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
