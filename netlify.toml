# Netlify build config for the Next.js app.
# The official Next.js runtime plugin handles SSR, API routes, and ISR.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions."inventory-reconciliation"]
  schedule = "* * * * *"

[functions."subscriber-activity-retention"]
  schedule = "0 3 * * *"

[functions."film-ticket-maintenance"]
  schedule = "* * * * *"
