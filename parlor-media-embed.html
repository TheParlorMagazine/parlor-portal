<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Parlor — Media Player</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #000000;
    --pink: #F1B7C0;
    --muted: #888888;
    --border: #e8d4d8;
    --cream: #fdf5f6;
    --white: #ffffff;
  }
  body {
    font-family: Georgia, serif;
    background: transparent;
    color: var(--ink);
    font-size: 14px;
  }

  #parlor-embed-root {
    width: 100%;
  }

  /* ── Loading / empty states ── */
  .embed-loading {
    padding: 16px;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }
  .embed-empty { display: none; }

  /* ── Media player (dark) ── */
  .media-player {
    background: #111;
    border-radius: 11px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .media-player-header {
    padding: 14px 18px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .media-player-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.45);
  }
  .media-player-duration {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
  }
  .media-player-title {
    font-family: Georgia, serif;
    font-size: 15px;
    color: #ffffff;
    padding: 6px 18px 14px;
    line-height: 1.4;
  }
  .media-player-controls {
    padding: 0 18px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .media-play-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--pink);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .media-play-btn:hover { opacity: 0.85; }
  .media-play-btn svg { width: 14px; height: 14px; color: #000; }
  .media-progress-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .media-progress {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    cursor: pointer;
    appearance: none;
    outline: none;
  }
  .media-progress::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--pink);
    cursor: pointer;
  }
  .media-time {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: rgba(255,255,255,0.4);
  }
  .media-speed {
    background: rgba(255,255,255,0.1);
    border: none;
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    font-family: Georgia, serif;
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
  }

  /* ── Listen banner (read recording) ── */
  .media-listen-banner {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .media-listen-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .media-listen-icon svg { width: 13px; height: 13px; color: var(--pink); }
  .media-listen-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
  .media-listen-title { font-family: Georgia, serif; font-size: 13px; font-weight: 500; color: var(--ink); }

  /* ── Video embed ── */
  .media-video-wrap {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 11px;
    overflow: hidden;
    background: #000;
    margin-bottom: 12px;
  }
  .media-video-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }

  /* ── Paywall ── */
  .media-paywall {
    position: relative;
    border-radius: 11px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .media-paywall-blur {
    filter: blur(4px);
    pointer-events: none;
    opacity: 0.5;
  }
  .media-paywall-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0,0,0,0.55);
    border-radius: 11px;
    padding: 20px;
    text-align: center;
  }
  .media-paywall-icon { font-size: 22px; }
  .media-paywall-msg {
    font-size: 13px;
    color: #ffffff;
    font-family: Georgia, serif;
    line-height: 1.5;
  }
  .media-paywall-btn {
    background: var(--pink);
    color: #000;
    border: none;
    padding: 8px 18px;
    border-radius: 7px;
    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
  }

  /* ── Transcript ── */
  .media-transcript-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink);
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 14px;
    cursor: pointer;
    font-family: Georgia, serif;
    transition: border-color 0.15s;
    margin-top: 4px;
  }
  .media-transcript-btn:hover { border-color: var(--pink); }

  /* ── Transcript modal ── */
  .transcript-modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,23,16,0.5);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }
  .transcript-modal-bg.open { display: flex; }
  .transcript-modal {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 13px;
    width: 620px;
    max-width: 93vw;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .transcript-modal-head {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .transcript-modal-title {
    font-family: Georgia, serif;
    font-size: 17px;
    font-weight: 500;
  }
  .transcript-modal-close {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .transcript-modal-body {
    padding: 20px 22px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.85;
    color: var(--ink);
    font-family: Georgia, serif;
    white-space: pre-wrap;
  }

  /* ── Section label ── */
  .embed-section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div id="parlor-embed-root">
  <div class="embed-loading" id="embedLoading">Loading…</div>
</div>

<!-- Transcript modal -->
<div class="transcript-modal-bg" id="transcriptModalBg">
  <div class="transcript-modal">
    <div class="transcript-modal-head">
      <div class="transcript-modal-title" id="transcriptModalTitle">Interview transcript</div>
      <button class="transcript-modal-close" onclick="closeTranscriptModal()">×</button>
    </div>
    <div class="transcript-modal-body" id="transcriptModalBody"></div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────
const VERCEL_URL = 'https://parlor-portal.vercel.app'; // Update to your actual Vercel URL
const PLAN_IDS = {
  READERS_CIRCLE: 'fccb348a-7433-4080-8699-9ef8c0e7a519',
  PRINTING_PRESS: 'c666f321-47e5-40c1-bc2a-565a2f52f64d'
};

// ── Transcript modal ─────────────────────────────────────
function openTranscriptModal(title, transcript) {
  document.getElementById('transcriptModalTitle').textContent = title || 'Interview transcript';
  document.getElementById('transcriptModalBody').textContent = transcript || '';
  document.getElementById('transcriptModalBg').classList.add('open');
}
function closeTranscriptModal() {
  document.getElementById('transcriptModalBg').classList.remove('open');
}
document.getElementById('transcriptModalBg').addEventListener('click', function(e) {
  if (e.target === this) closeTranscriptModal();
});

// ── Audio player helpers ─────────────────────────────────
function buildAudioPlayer(url, title, duration, id) {
  return `
    <div class="media-player">
      <div class="media-player-header">
        <div class="media-player-label">Now playing</div>
        <div class="media-player-duration">${duration || ''}</div>
      </div>
      <div class="media-player-title">${title || ''}</div>
      <audio id="${id}" src="${url}" preload="metadata" style="display:none"></audio>
      <div class="media-player-controls">
        <button class="media-play-btn" onclick="toggleAudio('${id}')">
          <svg id="${id}PlayIcon" viewBox="0 0 16 16" fill="currentColor"><path d="M4 3l9 5-9 5V3z"/></svg>
        </button>
        <div class="media-progress-wrap">
          <input type="range" class="media-progress" id="${id}Progress" value="0" min="0" max="100" step="0.1" oninput="seekAudio('${id}', this.value)">
          <div class="media-time">
            <span id="${id}Current">0:00</span>
            <span id="${id}Total">${duration || '0:00'}</span>
          </div>
        </div>
        <select class="media-speed" onchange="setSpeed('${id}', this.value)">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </div>
  `;
}

function toggleAudio(id) {
  const audio = document.getElementById(id);
  const icon = document.getElementById(id + 'PlayIcon');
  if (!audio) return;
  if (audio.paused) {
    audio.play();
    icon.innerHTML = '<rect x="3" y="3" width="3" height="10" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="10" rx="1" fill="currentColor"/>';
  } else {
    audio.pause();
    icon.innerHTML = '<path d="M4 3l9 5-9 5V3z" fill="currentColor"/>';
  }
}

function seekAudio(id, value) {
  const audio = document.getElementById(id);
  if (!audio || !audio.duration) return;
  audio.currentTime = (value / 100) * audio.duration;
}

function setSpeed(id, value) {
  const audio = document.getElementById(id);
  if (audio) audio.playbackRate = parseFloat(value);
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function initAudioPlayer(id) {
  const audio = document.getElementById(id);
  if (!audio) return;
  audio.addEventListener('timeupdate', () => {
    const progress = document.getElementById(id + 'Progress');
    const current = document.getElementById(id + 'Current');
    if (progress && audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
    if (current) current.textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => {
    const total = document.getElementById(id + 'Total');
    if (total) total.textContent = formatTime(audio.duration);
  });
  audio.addEventListener('ended', () => {
    const icon = document.getElementById(id + 'PlayIcon');
    if (icon) icon.innerHTML = '<path d="M4 3l9 5-9 5V3z" fill="currentColor"/>';
  });
}

// ── Render player ────────────────────────────────────────
function renderEmbed(fields, isPaid) {
  const root = document.getElementById('parlor-embed-root');
  const mediaType = fields['Accompanying Media Type'];
  const mediaUrl = fields['Media URL'] || '';
  const mediaDuration = fields['Media Duration'] || '';
  const mediaTitle = fields['Media Title'] || fields['Title'] || '';
  const transcript = fields['Transcript'] || '';

  let html = '';

  // ── Read Recording — not paywalled ──
  if (mediaType === 'Read Recording') {
    html += `
      <div class="embed-section-label">Listen to this article</div>
      <div class="media-listen-banner">
        <div class="media-listen-icon">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 1a5 5 0 015 5v3a2 2 0 01-2 2H9a1 1 0 01-1-1V8a1 1 0 011-1h1V6A3 3 0 005 6v1h1a1 1 0 011 1v2a1 1 0 01-1 1H4a2 2 0 01-2-2V6a5 5 0 015-5z" stroke="currentColor" stroke-width="1.4"/></svg>
        </div>
        <div>
          <div class="media-listen-label">Read recording</div>
          <div class="media-listen-title">${mediaTitle}${mediaDuration ? ' · ' + mediaDuration : ''}</div>
        </div>
      </div>
      ${buildAudioPlayer(mediaUrl, mediaTitle, mediaDuration, 'embedListenAudio')}
    `;
    root.innerHTML = html;
    setTimeout(() => initAudioPlayer('embedListenAudio'), 50);
    return;
  }

  // ── Audio or Video Interview — paywalled ──
  const isVideo = mediaType === 'Video Interview';
  const sectionLabel = isVideo ? '🎬 Watch the full interview' : '🎙️ Listen to the full interview';

  html += `<div class="embed-section-label">${sectionLabel}</div>`;

  if (!isPaid) {
    // Blurred paywall
    const blurredPlayer = isVideo
      ? `<div class="media-video-wrap"><iframe src="" title=""></iframe></div>`
      : buildAudioPlayer(mediaUrl, mediaTitle, mediaDuration, 'embedInterviewAudio');

    html += `
      <div class="media-paywall">
        <div class="media-paywall-blur">${blurredPlayer}</div>
        <div class="media-paywall-overlay">
          <div class="media-paywall-icon">🔒</div>
          <div class="media-paywall-msg">This interview is available to members and single-article readers.</div>
          <button class="media-paywall-btn" onclick="unlockWithPlan('59144c09-0a72-4df4-810c-438e8ed32268')">
            Purchase one-time access
          </button>
          <button class="media-paywall-btn" style="background:#000;color:#fff;margin-top:2px;" onclick="window.location.href='https://www.theparlormagazine.com/pricing-plans/become-a-member'">
            Become a member
          </button>
        </div>
      </div>
    `;
  } else {
    // Full player
    if (isVideo) {
      html += `
        <div class="media-video-wrap">
          <iframe src="${mediaUrl}" allowfullscreen title="${mediaTitle}"></iframe>
        </div>
      `;
    } else {
      html += buildAudioPlayer(mediaUrl, mediaTitle, mediaDuration, 'embedInterviewAudio');
    }

    // Transcript button
    if (transcript) {
      html += `
        <button class="media-transcript-btn" onclick="openTranscriptModal('${mediaTitle.replace(/'/g, "\\'")} — transcript', document.getElementById('_transcriptData').textContent)">
          📄 Read transcript
        </button>
        <div id="_transcriptData" style="display:none">${transcript}</div>
      `;
    }
  }

  root.innerHTML = html;
  if (isPaid && !isVideo) setTimeout(() => initAudioPlayer('embedInterviewAudio'), 50);
}

// ── Check member plan via Wix ────────────────────────────
async function getMemberPlan() {
  try {
    // Use Wix Members API via postMessage to parent
    return new Promise((resolve) => {
      const timeout = setTimeout(() => resolve(false), 3000);
      window.addEventListener('message', function handler(e) {
        if (e.data && e.data.type === 'PARLOR_MEMBER_DATA') {
          clearTimeout(timeout);
          window.removeEventListener('message', handler);
          const m = e.data;
          const isPaid =
            m.planId === PLAN_IDS.READERS_CIRCLE ||
            m.planId === PLAN_IDS.PRINTING_PRESS ||
            m.plan === "The Reader's Circle" ||
            m.plan === 'The Printing Press';
          resolve(isPaid);
        }
      });
      // Request member data from Wix parent
      window.parent.postMessage({ type: 'REQUEST_MEMBER_DATA' }, '*');
    });
  } catch (e) {
    return false;
  }
}

// ── Main init ────────────────────────────────────────────
async function init() {
  // Extract slug from URL
  const pathParts = window.location.pathname.split('/post/');
  const slug = pathParts.length > 1 ? pathParts[1].split('/')[0] : null;

  // ── TEST MODE — no slug found, show mock player ──
  if (!slug) {
    document.getElementById('embedLoading').style.display = 'none';
    renderEmbed({
      'Accompanying Media Type': 'Audio Interview',
      'Media URL': '',
      'Media Duration': '54 min',
      'Media Title': 'Full conversation with adrienne maree brown',
      'Transcript': 'This is a placeholder transcript for preview purposes.'
    }, true); // second arg = isPaid, set to false to test paywall
    return;
  }

  try {
    // Fetch library item by slug
    const res = await fetch(`${VERCEL_URL}/api/library?slug=${encodeURIComponent(slug)}`);
    const data = await res.json();

    if (!data.records || !data.records.length) {
      document.getElementById('embedLoading').style.display = 'none';
      return;
    }

    const fields = data.records[0].fields;

    // Check member status
    const isPaid = await getMemberPlan();

    // Always render
    document.getElementById('embedLoading').style.display = 'none';
    renderEmbed(fields, isPaid);

  } catch (err) {
    console.error('Parlor embed error:', err);
    document.getElementById('embedLoading').style.display = 'none';
  }
}

// ── Checkout relay ───────────────────────────────────────
function unlockWithPlan(planId) {
  const returnTo = window.location.pathname;
  sessionStorage.setItem('checkout:planId', planId);
  sessionStorage.setItem('checkout:returnTo', returnTo);
  window.location.href = '/checkout-relay';
}

init();
</script>
</body>
</html>
