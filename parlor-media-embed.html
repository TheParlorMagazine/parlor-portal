<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Parlor — Media Player</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #000000;
    --pink: #F1B7C0;
    --pinkborder: #e8a0b0;
    --muted: #888888;
    --border: #e8d4d8;
    --cream: #fdf5f6;
    --white: #ffffff;
  }
  body {
    font-family: Georgia, serif;
    background: transparent;
    color: var(--ink);
    font-size: 14px;
  }

  #parlor-embed-root { width: 100%; }

  .embed-loading {
    padding: 16px;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }

  .embed-section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* ── Media player — white with pink border ── */
  .media-player {
    background: #ffffff;
    border: 1.5px solid #e8d4d8;
    border-radius: 11px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .media-player-header {
    padding: 14px 18px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .media-player-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .media-player-transcript-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-family: Georgia, serif;
    color: var(--ink);
    background: none;
    border: 1px solid #e8d4d8;
    border-radius: 20px;
    padding: 3px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .media-player-transcript-btn:hover { background: var(--cream); }
  .media-player-title {
    font-family: Georgia, serif;
    font-size: 15px;
    color: var(--muted);
    padding: 6px 18px 14px;
    line-height: 1.4;
  }
  .media-player-controls {
    padding: 0 18px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .media-play-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #000000;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .media-play-btn:hover { opacity: 0.85; }
  .media-play-btn svg { width: 14px; height: 14px; color: #ffffff; }
  .media-progress-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .media-progress {
    width: 100%;
    height: 3px;
    background: #000000;
    border-radius: 2px;
    cursor: pointer;
    appearance: none;
    outline: none;
  }
  .media-progress::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #000000;
    cursor: pointer;
  }
  .media-time {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
  }
  .media-speed {
    background: var(--cream);
    border: 1px solid var(--border);
    color: var(--ink);
    font-size: 11px;
    font-family: Georgia, serif;
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
  }

  /* ── Listen banner (read recording) ── */
  .media-listen-banner {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .media-listen-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .media-listen-icon svg { width: 13px; height: 13px; color: var(--pink); }
  .media-listen-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
  .media-listen-title { font-family: Georgia, serif; font-size: 13px; font-weight: 500; color: var(--ink); }

  /* ── Video embed ── */
  .media-video-wrap {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 11px;
    overflow: hidden;
    background: #000;
    margin-bottom: 12px;
  }
  .media-video-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }

  /* ── Paywall ── */
  .media-paywall {
  position: relative;
  border-radius: 11px;
  margin-bottom: 12px;
  min-height: 120px;
}
  .media-paywall-blur {
  filter: blur(2px);
  pointer-events: none;
  opacity: 0.6;
}
  .media-paywall-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(0,0,0,0.55);
  border-radius: 11px;
  padding: 12px 16px 18px;
  text-align: center;
}
.media-paywall-buttons {
  display: flex;
  flex-direction: row;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 4px;
}
  .media-paywall-icon { font-size: 22px; }
  .media-paywall-msg {
    font-size: 13px;
    color: #ffffff;
    font-family: Georgia, serif;
    line-height: 1.5;
  }
  .media-paywall-btn {
    background: var(--pink);
    color: #000;
    border: none;
    padding: 8px 18px;
    border-radius: 7px;
    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
  }

  /* ── Transcript modal ── */
  .transcript-modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,23,16,0.5);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }
  .transcript-modal-bg.open { display: flex; }
  .transcript-modal {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 13px;
    width: 620px;
    max-width: 93vw;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .transcript-modal-head {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .transcript-modal-title {
    font-family: Georgia, serif;
    font-size: 17px;
    font-weight: 500;
  }
  .transcript-modal-close {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .transcript-modal-body {
    padding: 20px 22px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.85;
    color: var(--ink);
    font-family: Georgia, serif;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div id="parlor-embed-root">
  <div class="embed-loading" id="embedLoading">Loading…</div>
</div>

<div class="transcript-modal-bg" id="transcriptModalBg">
  <div class="transcript-modal">
    <div class="transcript-modal-head">
      <div class="transcript-modal-title" id="transcriptModalTitle">Interview transcript</div>
      <button class="transcript-modal-close" onclick="closeTranscriptModal()">×</button>
    </div>
    <div class="transcript-modal-body" id="transcriptModalBody"></div>
  </div>
</div>

<script>
const VERCEL_URL = 'https://parlor-portal.vercel.app'; // ← update to your actual Vercel URL
const PLAN_IDS = {
  READERS_CIRCLE: 'fccb348a-7433-4080-8699-9ef8c0e7a519',
  PRINTING_PRESS: 'c666f321-47e5-40c1-bc2a-565a2f52f64d'
};

function openTranscriptModal(title, body) {
  document.getElementById('transcriptModalTitle').textContent = title || 'Interview transcript';
  document.getElementById('transcriptModalBody').textContent = body || '';
  document.getElementById('transcriptModalBg').classList.add('open');
}
function closeTranscriptModal() {
  document.getElementById('transcriptModalBg').classList.remove('open');
}
document.getElementById('transcriptModalBg').addEventListener('click', function(e) {
  if (e.target === this) closeTranscriptModal();
});

function buildAudioPlayer(url, title, duration, id, transcriptBtnHtml) {
  return `
    <div class="media-player">
      <div class="media-player-header">
        <div class="media-player-label">Now playing</div>
        ${transcriptBtnHtml || ''}
      </div>
      <div class="media-player-title">${title || ''}</div>
      <audio id="${id}" src="${url}" preload="metadata" style="display:none"></audio>
      <div class="media-player-controls">
        <button class="media-play-btn" onclick="toggleAudio('${id}')">
          <svg id="${id}PlayIcon" viewBox="0 0 16 16" fill="currentColor"><path d="M4 3l9 5-9 5V3z"/></svg>
        </button>
        <div class="media-progress-wrap">
          <input type="range" class="media-progress" id="${id}Progress" value="0" min="0" max="100" step="0.1" oninput="seekAudio('${id}', this.value)">
          <div class="media-time">
            <span id="${id}Current">0:00</span>
            <span id="${id}Total">${duration || '0:00'}</span>
          </div>
        </div>
        <select class="media-speed" onchange="setSpeed('${id}', this.value)">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </div>
  `;
}

function toggleAudio(id) {
  const audio = document.getElementById(id);
  const icon = document.getElementById(id + 'PlayIcon');
  if (!audio) return;
  if (audio.paused) {
    audio.play();
    icon.innerHTML = '<rect x="3" y="3" width="3" height="10" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="10" rx="1" fill="currentColor"/>';
  } else {
    audio.pause();
    icon.innerHTML = '<path d="M4 3l9 5-9 5V3z" fill="currentColor"/>';
  }
}

function seekAudio(id, value) {
  const audio = document.getElementById(id);
  if (!audio || !audio.duration) return;
  audio.currentTime = (value / 100) * audio.duration;
}

function setSpeed(id, value) {
  const audio = document.getElementById(id);
  if (audio) audio.playbackRate = parseFloat(value);
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function initAudioPlayer(id) {
  const audio = document.getElementById(id);
  if (!audio) return;
  audio.addEventListener('timeupdate', () => {
    const progress = document.getElementById(id + 'Progress');
    const current = document.getElementById(id + 'Current');
    if (progress && audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
    if (current) current.textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => {
    const total = document.getElementById(id + 'Total');
    if (total) total.textContent = formatTime(audio.duration);
  });
  audio.addEventListener('ended', () => {
    const icon = document.getElementById(id + 'PlayIcon');
    if (icon) icon.innerHTML = '<path d="M4 3l9 5-9 5V3z" fill="currentColor"/>';
  });
}

function renderEmbed(fields, isPaid, slug) {
  const root = document.getElementById('parlor-embed-root');
  const mediaType  = fields['Accompanying Media Type'];
  const mediaUrl   = fields['Media URL'] || '';
  const duration   = fields['Media Duration'] || '';
  const mediaTitle = fields['Media Title'] || fields['Title'] || '';
  const transcript = fields['Transcript'] || '';

  let html = '';

  // Read Recording — never paywalled
  if (mediaType === 'Read Recording') {
    html += `
      <div class="embed-section-label">Listen to this article</div>
      <div class="media-listen-banner">
        <div class="media-listen-icon">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 1a5 5 0 015 5v3a2 2 0 01-2 2H9a1 1 0 01-1-1V8a1 1 0 011-1h1V6A3 3 0 005 6v1h1a1 1 0 011 1v2a1 1 0 01-1 1H4a2 2 0 01-2-2V6a5 5 0 015-5z" stroke="currentColor" stroke-width="1.4"/></svg>
        </div>
        <div>
          <div class="media-listen-label">Read recording</div>
          <div class="media-listen-title">${mediaTitle}${duration ? ' · ' + duration : ''}</div>
        </div>
      </div>
      ${buildAudioPlayer(mediaUrl, mediaTitle, duration, 'embedListenAudio', '')}
    `;
    root.innerHTML = html;
    setTimeout(() => initAudioPlayer('embedListenAudio'), 50);
    return;
  }

  // Interview — paywalled
  const isVideo = mediaType === 'Video Interview';
  
 if (!isPaid) {
  const blurredPlayer = isVideo
    ? `<div class="media-video-wrap"><iframe src="" title=""></iframe></div>`
    : buildAudioPlayer(mediaUrl, mediaTitle, duration, 'embedInterviewAudio', '');

  const articleUrl = `https://www.theparlormagazine.com/post/${slug}`;
  const returnToEncoded = encodeURIComponent(articleUrl);

  html += `
    <div class="media-paywall" id="paywallWrap">
      <div id="paywallPlayerPreview" style="pointer-events:auto;">${blurredPlayer}</div>
      <div class="media-paywall-overlay" id="paywallOverlay" style="opacity:0;pointer-events:none;transition:opacity 1s ease;">
<div class="media-paywall-msg">This interview is available to members only.</div>
<div class="media-paywall-buttons">
  <a class="media-paywall-btn"
    href="https://www.theparlormagazine.com/checkout-relay?planId=59144c09-0a72-4df4-810c-438e8ed32268&returnTo=${returnToEncoded}"
    target="_top"
    style="text-decoration:none;display:inline-block;">
    Purchase one-time access
  </a>
  <a class="media-paywall-btn"
    href="https://www.theparlormagazine.com/checkout-relay?planId=fccb348a-7433-4080-8699-9ef8c0e7a519&returnTo=${returnToEncoded}"
    target="_top"
    style="background:#000;color:#fff;text-decoration:none;display:inline-block;">
    Become a member
  </a>
</div>
      </div>
    </div>
  `;
  } else {
    // Transcript button for player header
    const transcriptBtn = transcript
      ? `<button class="media-player-transcript-btn" onclick="openTranscriptModal('${mediaTitle.replace(/'/g, "\\'")} — transcript', document.getElementById('_transcriptData').textContent)">Read transcript</button>`
      : '';

    if (isVideo) {
      html += `
        <div class="media-video-wrap">
          <iframe src="${mediaUrl}" allowfullscreen title="${mediaTitle}"></iframe>
        </div>
        ${transcript ? `<button class="media-player-transcript-btn" style="margin-top:8px;" onclick="openTranscriptModal('${mediaTitle.replace(/'/g, "\\'")} — transcript', document.getElementById('_transcriptData').textContent)">Read transcript</button>` : ''}
      `;
    } else {
      html += buildAudioPlayer(mediaUrl, mediaTitle, duration, 'embedInterviewAudio', transcriptBtn);
    }

    if (transcript) {
      html += `<div id="_transcriptData" style="display:none">${transcript}</div>`;
    }
  }

 root.innerHTML = html;
if (!isPaid) {
  setTimeout(() => initAudioPlayer('embedInterviewAudio'), 50);
  setTimeout(() => {
      const overlay = document.getElementById('paywallOverlay');
      const preview = document.getElementById('paywallPlayerPreview');
      const audio = document.getElementById('embedInterviewAudio');
if (audio) audio.pause();
      if (overlay) {
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'auto';
}
      if (preview) {
        preview.style.filter = 'blur(1px)';
        preview.style.opacity = '0.8';
        preview.style.transition = 'filter 1.5s ease, opacity 1.5s ease';
      }
      if (typeof resizeParent === 'function') resizeParent();
    }, 9000);
  }
}

async function getMemberPlan() {
  try {
    return new Promise((resolve) => {
      const timeout = setTimeout(() => resolve({ isPaid: false, planId: '' }), 3000);
      window.addEventListener('message', function handler(e) {
        if (e.data && e.data.type === 'PARLOR_MEMBER_DATA') {
          clearTimeout(timeout);
          window.removeEventListener('message', handler);
          const m = e.data;
          const isPaid =
            m.planId === PLAN_IDS.READERS_CIRCLE ||
            m.planId === PLAN_IDS.PRINTING_PRESS ||
            m.plan === "The Reader's Circle" ||
            m.plan === 'The Printing Press';
          resolve({ isPaid, planId: m.planId || '', memberId: m.memberId || '' });
        }
      });
      window.parent.postMessage({ type: 'REQUEST_MEMBER_DATA' }, '*');
    });
  } catch (e) {
    return { isPaid: false, planId: '', memberId: '' };
  }
}

function unlockWithPlan(planId) {
  const returnTo = encodeURIComponent(window.top.location.href);
  window.top.location.href = `https://www.theparlormagazine.com/checkout-relay?planId=${planId}&returnTo=${returnTo}`;
}

async function init() {
  // Try URL parameter first
  const params = new URLSearchParams(window.location.search);
  let slug = params.get('slug');

  if (!slug) {
    // Try parent URL via referrer
    const parentUrl = document.referrer;
    if (parentUrl) {
      const parts = parentUrl.split('/post/');
      if (parts.length > 1) slug = parts[1].split('/')[0].split('?')[0];
    }
  }

  if (!slug) {
    // Try own pathname as fallback
    const parts = window.location.pathname.split('/post/');
    if (parts.length > 1) slug = parts[1].split('/')[0];
  }

  // Test mode — no slug found
  if (!slug) {
    document.getElementById('embedLoading').style.display = 'none';
    renderEmbed({
      'Accompanying Media Type': 'Audio Interview',
      'Media URL': '',
      'Media Duration': '54 min',
      'Media Title': 'Full conversation with adrienne maree brown',
      'Transcript': 'This is a placeholder transcript for preview purposes.'
    }, true, 'test');
    return;
  }

  try {
    const res = await fetch(`${VERCEL_URL}/api/library?slug=${encodeURIComponent(slug)}`);
    const data = await res.json();

    if (!data.records || !data.records.length) {
      document.getElementById('embedLoading').style.display = 'none';
      return;
    }

    const fields = data.records[0].fields;
const { isPaid: basePaid, planId: memberPlanId, memberId } = await getMemberPlan();
const mediaPlanId = fields['Media Plan ID'] || '';
let isPaid = basePaid;

if (!isPaid && mediaPlanId && memberId) {
  try {
    const plansRes = await fetch(`${VERCEL_URL}/api/member-plans?memberId=${encodeURIComponent(memberId)}`);
    const plansData = await plansRes.json();
    isPaid = (plansData.planIds || []).includes(mediaPlanId);
  } catch(e) {}
}

    document.getElementById('embedLoading').style.display = 'none';
    renderEmbed(fields, isPaid, slug);

  } catch (err) {
    console.error('Parlor embed error:', err);
    document.getElementById('embedLoading').style.display = 'none';
  }
}

init();
</script>
 <script>
  function resizeParent() {
    const height = document.body.scrollHeight;
    window.parent.postMessage({ type: 'PARLOR_RESIZE', height: height }, '*');
  }
  window.addEventListener('load', resizeParent);
  new MutationObserver(resizeParent).observe(document.body, { childList: true, subtree: true });
</script>
</body>
</html>
